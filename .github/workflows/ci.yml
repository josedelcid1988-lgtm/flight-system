name: CI

# Every pull request and every push to main: the generated files are current, then every suite runs with
# the persistence mirror off and on. Any failed check, page error or unexplained skip fails the run
# (tools/run-suites.mjs; the explained skips are in tests/allowed_skips.json).
# The build stamp is not committed: CI generates it in its working copy, verifies it, and tests the stamped
# build. The release record in VERSION.md is written at release time (tools/release-report.mjs); CI builds
# it with --dry-run so broken release tooling fails here, before a release. The suites job tests the merge
# ref; the release-record job runs the suites again on the pull request head, the commit the record names.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flight
          POSTGRES_PASSWORD: flight_test_password
          POSTGRES_DB: flight_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flight -d flight_system"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # GitHub's merge ref on a pull request: the suites test the result of merging it into main.
      - uses: actions/checkout@v4

      # node:sqlite without a flag needs Node 22.13 or later (server/package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # The frontend bundle and its build checker use the locked React, esbuild, and Playwright dependencies.
      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install PostgreSQL 16 client tools for backup and restore verification
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: React bundle, local assets, and production integration are current
        run: npm run build:react -- --check

      - name: Committed index.html carries the VERSION.md build and no generated stamp
        run: node tools/stamp-build.mjs --check

      - name: PostgreSQL storage integration
        env:
          FLIGHT_DATABASE_URL: postgresql://flight:flight_test_password@localhost:5432/flight_system
        run: npm run test:postgres

      - name: Demo build and fixtures are current
        run: node tools/build-demo.mjs --check

      - name: Role matrix is current
        run: node tools/role-matrix.mjs --check

      # Not committed: stamp this run's working copy, rebuild the demo and fixtures from it, and verify the
      # stamp recomputes. An unstamped or wrongly stamped file fails --verify.
      - name: Generate and verify the build stamp for this run
        run: |
          node tools/stamp-build.mjs
          node tools/build-demo.mjs
          node tools/stamp-build.mjs --verify index.html

      - name: All suites, mirror off
        run: node tools/run-suites.mjs --parallel 2

      - name: All suites, mirror on
        if: success() || failure()
        run: node tools/run-suites.mjs --mirror --parallel 2

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results
          path: |
            tests/suite_results.json
            tests/suite_results_mirror.json
            tests/suite_*.log
          if-no-files-found: ignore

  # The release record names one commit and accepts only suite results produced at that commit, so it is
  # built in its own job on the pull request head itself, not on the merge ref the suites job tests.
  release-record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate and verify the build stamp for this commit
        run: |
          node tools/stamp-build.mjs
          node tools/build-demo.mjs
          node tools/stamp-build.mjs --verify index.html

      - name: All suites at this commit, mirror off
        run: node tools/run-suites.mjs --parallel 2

      - name: All suites at this commit, mirror on
        run: node tools/run-suites.mjs --mirror --parallel 2

      - name: Release record builds from this commit's results (dry run, not committed)
        env:
          FLIGHT_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/release-report.mjs --dry-run

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-record-suite-results
          path: |
            tests/suite_results.json
            tests/suite_results_mirror.json
            tests/suite_*.log
          if-no-files-found: ignore
