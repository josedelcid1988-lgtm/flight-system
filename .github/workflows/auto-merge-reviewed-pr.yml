name: Auto-merge Claude and Jinx approved PRs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [CI, Claude PR Review]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: auto-merge-flight-system
  cancel-in-progress: false

jobs:
  merge-when-approved:
    if: >-
      github.repository == 'josedelcid1988-lgtm/flight-system' &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login == 'claude[bot]')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted gate helpers from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify current-head Claude and Jinx approvals, then merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          JINX_REVIEWER_LOGIN: ${{ vars.JINX_REVIEWER_LOGIN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const gateSignals = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-gate.cjs`);
            const jinxLogin = (process.env.JINX_REVIEWER_LOGIN || '').trim();
            const note = message => core.notice('Auto-merge waiting: ' + message);
            if (!jinxLogin) {
              note('Set the Actions variable JINX_REVIEWER_LOGIN to Jinx’s dedicated GitHub login.');
              return;
            }

            async function candidatePulls() {
              if (context.eventName === 'pull_request_target') return [context.payload.pull_request];
              if (context.eventName === 'issue_comment') {
                const issue = context.payload.issue;
                if (!issue?.pull_request || context.payload.comment?.user?.login !== 'claude[bot]') return [];
                return [(await github.rest.pulls.get({ owner, repo, pull_number: issue.number })).data];
              }
              if (context.eventName === 'workflow_run') {
                const run = context.payload.workflow_run;
                if (!['CI', 'Claude PR Review'].includes(run.name)) return [];
                if (run.name === 'CI' && run.event !== 'pull_request') return [];
                if (run.name === 'Claude PR Review' && run.event !== 'pull_request_target') return [];
              }
              return await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', base: 'main', per_page: 100,
              });
            }

            async function currentCiRuns(pull, sha) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'ci.yml', branch: pull.head.ref, event: 'pull_request', per_page: 100,
              });
              return runs.filter(run => run.event === 'pull_request' && run.head_branch === pull.head.ref &&
                (run.pull_requests || []).some(link => link.number === pull.number && link.head?.sha === sha))
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            }

            async function reviewThreads(pullNumber) {
              const query = 'query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {' +
                ' repository(owner:$owner, name:$repo) { pullRequest(number:$number) {' +
                ' reviewThreads(first:100, after:$cursor) {' +
                ' nodes { isResolved comments(first:100) { nodes { body } pageInfo { hasNextPage } } }' +
                ' pageInfo { hasNextPage endCursor } } } } }';
              const result = [];
              let cursor = null;
              do {
                const data = await github.graphql(query, { owner, repo, number: pullNumber, cursor });
                const page = data.repository.pullRequest.reviewThreads;
                for (const thread of page.nodes) {
                  if (thread.comments.pageInfo.hasNextPage) throw new Error('A review thread has more than 100 comments; cannot verify all findings.');
                  result.push({ isResolved: thread.isResolved, comments: thread.comments.nodes.map(comment => comment.body || '') });
                }
                if (!page.pageInfo.hasNextPage) return result;
                cursor = page.pageInfo.endCursor;
              } while (true);
            }

            async function gate(pull) {
              if (!pull || pull.state !== 'open' || pull.draft || pull.base.ref !== 'main') {
                return { ok: false, message: 'Only open, ready-for-review PRs targeting main are eligible.' };
              }
              if (!gateSignals.isIndependentReviewer(jinxLogin, pull.user?.login)) {
                return { ok: false, message: 'Jinx’s approval identity must be a dedicated account separate from the PR author.' };
              }

              const headSha = pull.head.sha;
              const mainSha = (await github.rest.repos.getBranch({ owner, repo, branch: 'main' })).data.commit.sha;
              const comparison = await github.rest.repos.compareCommits({ owner, repo, base: mainSha, head: headSha });
              if (!gateSignals.isEligiblePullRequest(pull, mainSha, comparison.data.behind_by)) {
                return { ok: false, message: 'The PR is not mergeable against the current main SHA; update it and obtain fresh head-bound approvals.' };
              }

              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pull.number, per_page: 100,
              });
              if (!gateSignals.changedFilesComplete(changedFiles, pull.changed_files)) {
                return { ok: false, message: 'GitHub returned an incomplete changed-file list; cannot verify protected paths.' };
              }
              if (gateSignals.hasProtectedAutoMergeChange(changedFiles)) {
                return { ok: false, message: 'This PR changes workflow or test-gate policy files. The trusted merge workflow will not auto-merge that class of change.' };
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number, per_page: 100,
              });
              const descriptionSha = gateSignals.descriptionSha256(pull);
              if (!gateSignals.claudeApproved(comments, headSha, mainSha, descriptionSha)) {
                return { ok: false, message: 'The latest claude[bot] summary must approve this exact PR head, current main SHA, and PR title/description.' };
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pull.number, per_page: 100,
              });
              if (!gateSignals.jinxApproved(reviews, jinxLogin, headSha)) {
                return { ok: false, message: 'Jinx’s latest submitted COMMENTED review must explicitly say No blockers and be anchored to this exact PR head.' };
              }

              const ciRuns = await currentCiRuns(pull, headSha);
              if (!gateSignals.latestCiSucceeded(ciRuns, pull.number, headSha)) {
                return { ok: false, message: 'The latest CI run linked to this PR and exact head SHA is missing or not successful.' };
              }

              const threads = await reviewThreads(pull.number);
              if (gateSignals.hasUnresolvedImportant(threads)) {
                return { ok: false, message: 'There is an unresolved Important review thread.' };
              }
              return { ok: true, headSha, mainSha };
            }

            const pulls = await candidatePulls();
            for (const candidate of pulls) {
              let pull = (await github.rest.pulls.get({ owner, repo, pull_number: candidate.number })).data;
              let result = await gate(pull);
              if (!result.ok) {
                note(`PR #${pull.number}: ${result.message}`);
                continue;
              }

              // Re-read the PR and all approval/CI evidence immediately before the SHA-guarded merge.
              pull = (await github.rest.pulls.get({ owner, repo, pull_number: pull.number })).data;
              result = await gate(pull);
              if (!result.ok || result.headSha !== pull.head.sha || pull.base.ref !== 'main') {
                note(`PR #${pull.number}: ${result.message || 'the head or base changed during verification.'}`);
                continue;
              }

              const merged = await github.rest.pulls.merge({
                owner, repo, pull_number: pull.number, sha: result.headSha, merge_method: 'squash',
              });
              if (!merged.data.merged) {
                core.setFailed(`GitHub refused the SHA-guarded merge for PR #${pull.number}: ${merged.data.message || 'unknown reason'}`);
                continue;
              }
              core.info(`Merged PR #${pull.number} at verified head ${result.headSha}, reviewed against main ${result.mainSha}.`);
            }
