name: Claude Review

# Every pull request gets a Claude review against REVIEW.md and AGENTS.md, on open and on every push.
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` on a machine signed in
# to the Claude account that should pay for reviews) or ANTHROPIC_API_KEY. Without either, the job
# says so and passes, so a missing secret never turns a PR red.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets; skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Credentials are set
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Claude review skipped: add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.creds.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}
            EVENT: ${{ github.event.action }}

            You are the required reviewer for this pull request. The PR branch is checked out.

            1. Read AGENTS.md and REVIEW.md in full. REVIEW.md defines what is Important, what is a
               Nit, what never to report, the evidence bar and the shape of the review. Follow it exactly.
            2. Read the whole change: `gh pr view` for the description, `git diff origin/BASE...HEAD`
               for the code. Open the surrounding code for every hunk you judge; do not review from the
               diff alone. index.html is large: use Grep to find the functions a hunk touches.
            3. For each candidate finding, verify it against the current source before posting. Drop
               anything you cannot back with a file:line citation and a concrete failure.
            4. Post each verified finding as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true), starting with
               "Important:" or "Nit:" and ending with what to change.
            5. Post one top-level summary with `gh pr comment`, opening with the tally line REVIEW.md asks for.
               If EVENT is `synchronize`, read your earlier comments first (`gh pr view --comments`), say
               which earlier findings the push fixed, and post only new Important findings.

            Do not push commits, approve or request changes. Only post GitHub comments.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
